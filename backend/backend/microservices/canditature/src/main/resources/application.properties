spring.application.name=canditature
server.port=8085

# eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ---- Actuator (observabilite) ----
# Exposer les endpoints health, info et metrics (seul health l'est par defaut)
management.endpoints.web.exposure.include=health,info,metrics
# Afficher le detail des composants dans /health (db, diskSpace, ping...)
management.endpoint.health.show-details=always
# Transmettre a Eureka le statut de /health (passe DOWN si un composant tombe)
eureka.client.healthcheck.enabled=true
# Publier les proprietes info.* dans /actuator/info (desactive par defaut)
management.info.env.enabled=true

# Contenu affiche par /actuator/info
info.app.name=canditature
info.app.version=1.0.0
info.app.description=Microservice de gestion des candidatures
info.app.team=Nom de votre equipe
